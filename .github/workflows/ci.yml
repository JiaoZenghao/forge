name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        if: matrix.go == 'stable' && runner.os != 'Windows'
        run: go test -race ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - name: Build release archives
        run: go run ./tools/release --version 0.0.0-ci --commit "${GITHUB_SHA}" --date 2000-01-01T00:00:00Z --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: forge-ci-archives
          path: dist/
          if-no-files-found: error
